<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethiopian Birr Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

        <h1>Ethiopian Currency Converter</h1>

        <p id="status">Loading rates…</p>

        <section class="converter">
            <h2>Currency Converter</h2>

            <form id="convert-form">

                <label for="amount">Amount in ETB</label>
                <input
                    id="amount"
                    type="number"
                    value="100"
                    min="0"
                    step="0.01"
                >

                <label for="currency">Currency</label>
                <select id="currency"></select>

                <div class="buttons">
                    <button type="submit">Convert</button>
                    <button type="button" id="watch">Add to Watchlist</button>
                </div>

            </form>

            <p id="result"></p>
        </section>

        <section class="watch-section">
            <h2>Watchlist</h2>
            <ul id="watchlist"></ul>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
